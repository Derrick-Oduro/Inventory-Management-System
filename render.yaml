services:
  - type: web
    name: it-support-system
    runtime: docker
    dockerfilePath: Dockerfile
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        sync: false
      - key: APP_URL
        value: https://ims-b8y2.onrender.com
      - key: ASSET_URL
        value: https://ims-b8y2.onrender.com
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_NAME
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: it-support-system-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: RUN_DATABASE_MIGRATIONS
        value: true
      - key: VIEW_COMPILED_PATH
        value: /var/www/html/storage/framework/views

databases:
  - name: it-support-system-db
    databaseName: it_support_system
    user: it_support_system
