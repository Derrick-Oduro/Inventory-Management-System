services:
  # === Laravel Backend ===
  - type: web
    name: laravel-backend
    env: docker
    plan: free
    buildCommand: |
      cd backend
      composer install --no-dev --optimize-autoloader
      php artisan key:generate
      php artisan migrate --force
    startCommand: php artisan serve --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_KEY
        sync: false
      - key: APP_DEBUG
        value: false
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        value: your-db-host
      - key: DB_PORT
        value: 3306
      - key: DB_DATABASE
        value: your-db
      - key: DB_USERNAME
        value: your-user
      - key: DB_PASSWORD
        value: your-password
      - key: FRONTEND_URL
        value: https://inventory-management-system.onrender.com

  # === React Frontend ===
  - type: web
    name: react-frontend
    env: static
    buildCommand: |
      cd frontend
      npm install
      npm run build
    staticPublishPath: frontend/build
    envVars:
      - key: REACT_APP_API_URL
        value: https://your-backend.onrender.com/api
